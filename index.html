<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>littlemagehero's Root Modules Repository</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1 id="title">littlemagehero's Root Modules Repository</h1>
  <p class="sub" id="desc"></p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search modules" aria-label="Search modules" autocomplete="off">
    <button id="copy" type="button">Copy repo URL</button>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"><div class="state">Loading modules...</div></div>
  <footer>Credit goes to each module's original author.</footer>
</main>
<script src="assets/app.js" defer></script>
</body>
</html>
